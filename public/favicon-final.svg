  <!-- Deliberately just the two letters, flat-filled, no shadows/strokes/
       dots/gradients — at 16-32px (real favicon sizes) that fine detail
       from the header mark just reads as noise, not texture. Colors echo
       the header logo's split-sides treatment (left cyan, right yellow)
       without trying to reproduce it exactly. -->
  <style>
    .qp-bg { fill: #0B0E1A; }
    .qp-q { fill: #22C4F0; }
    .qp-p { fill: #FFD23F; }
    @media (prefers-color-scheme: light) {
      .qp-bg { fill: #ECE7D9; }
      .qp-q { fill: #0A7FA8; }
      .qp-p { fill: #A97C00; }
    }
  </style>
