<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="QP">
  <!-- Round two: flat cyan/yellow letters read as loud at this size with
       nothing else to anchor them, and dropping the brackets lost the
       one shape that actually identifies this as the header mark. So:
       letters go back to a quiet neutral fill (no color, no shadow), and
       a scaled-back version of the brackets returns (thin stroke, no
       panel/dots/gutter behind them) just to frame the pair and carry
       the split-sides color idea (left cyan, right yellow). -->
  <style>
    .qp-bg { fill: #0B0E1A; }
    .qp-letter { fill: #ECE7D9; }
    .qp-left { stroke: #22C4F0; }
    .qp-right { stroke: #FFD23F; }
    @media (prefers-color-scheme: light) {
      .qp-bg { fill: #ECE7D9; }
      .qp-letter { fill: #11131F; }
      .qp-left { stroke: #0A7FA8; }
      .qp-right { stroke: #A97C00; }
    }
  </style>
  <rect class="qp-bg" width="64" height="64" rx="8" />
  <path class="qp-left" d="M6 10 L1 32 L6 54" fill="none" stroke-width="3" stroke-linecap="butt" stroke-linejoin="miter" />
  <path class="qp-right" d="M58 10 L63 32 L58 54" fill="none" stroke-width="3" stroke-linecap="butt" stroke-linejoin="miter" />
